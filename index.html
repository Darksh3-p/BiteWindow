function shiftTide(m){const o=(S.toff||{})[lk()]||0;if(!o||!m||!m.hourly||!m.hourly.sea_level_height_msl)return m;const a=m.hourly.sea_level_height_msl,sh=o/60,b=a.map((_,j)=>{const t=j-sh,i=Math.floor(t),x=a[i],y=a[i+1];return x==null?a[j]:(y==null?x:x+(y-x)*(t-i))});return{...m,hourly:{...m.hourly,sea_level_height_msl:b}}}
function setToff(v){const st=T0&&T0.stale,at=T0&&T0.at;S.toff[lk()]=v;if(RAW)buildAll(RAW.w,RAW.m);if(st){ALL.forEach(x=>{if(x){x.at=at;x.stale=1}});T0.at=at;T0.stale=1}render()}
function applyToff(){const i=+$('#tc_i').value,t=$('#tc_t').value;if(!t)return;const p=t.split(':'),df=((((+p[0])*60+(+p[1])-D.TT[i][0]*60)+360)%720+720)%720-360;setToff(Math.max(-360,Math.min(360,Math.round((S.toff[lk()]||0)+df))))}
function tideCheck(){const d=D,o=(S.toff||{})[lk()]||0;if(d.noTide||!d.TT.length)return '';return card('Check tide against official table','clock',`<div class="sm" style="margin-bottom:8px">Model tide times can differ from the NAMRIA table. Pick a tide, enter the official time, and every tide shifts to match. Saved for this spot.</div><label>Tide</label><select id="tc_i">${d.TT.map((a,i)=>`<option value="${i}">${a[1]} ${f(a[0])}</option>`).join('')}</select><label style="margin-top:8px">Official table time</label><input id="tc_t" type="time"><button class="btn p" style="margin-top:8px" onclick="applyToff()">Apply</button>${o?`<div class="sm n" style="margin:8px 0">Current shift: ${o>0?'+':''}${o} min</div><button class="btn" onclick="setToff(0)">Reset</button>`:''}`,'T1','full')}
function localCard(){const sp=curSpot(),ty=S.spot||(sp&&sp.type),m=D.ymd[1]+1,tg=SPC.filter(x=>(!ty||x.h.includes(ty))&&x.m.includes(m)&&mine(x));let h='';

h+=card('Local rules and safety','shield',`${sp&&sp.mpa?'<div class="warn" style="margin-bottom:6px">Protected area nearby. Fishing may be restricted. Confirm with the LGU or BFAR.</div>':''}<div class="sm" style="color:var(--t)">Rules, closed seasons and protected zones differ by municipality. Ask the local government unit or BFAR first.</div><div class="chips" style="margin-top:8px">${[['PAGASA weather','https://www.pagasa.dost.gov.ph/'],['BFAR','https://www.bfar.da.gov.ph/'],['NAMRIA tides','https://www.namria.gov.ph/']].map(a=>`<a class="chip" href="${a[1]}" target="_blank" rel="noopener" style="text-decoration:none">${a[0]}</a>`).join('')}</div><div class="sm" style="margin-top:8px">Typhoon season runs roughly June to November. Do not go out under any tropical cyclone wind signal.</div>`,'T1');return h}
const lt_=l=>{const ty=effSpot(),m=D.ymd[1]+1,t=SPC.filter(x=>eatsT(x,l,lightOf(D,D.ix))&&(!ty||x.h.includes(ty))&&x.m.includes(m));return t.length?card('Local targets','fish',`<div class="sm" style="color:var(--t)">${t.map(x=>x.n).join(', ')}</div>`,'T3'):''};
function useSpot(id){const x=LSPOTS.find(q=>q.id==id);S.loc={name:x.name,lat:x.lat,lng:x.lng,sid:x.id};S.spot=x.type;S.manual=1;S.ranked=null;closeM();load()}
try{TMO=new MutationObserver(tl);TMO.observe(document.body,{childList:true,subtree:true,characterData:true})}catch(e){}
function modalHTML(h){$('#layer').innerHTML=`<div class="mo" onclick="if(event.target==this)closeM()"><div>${h}</div></div>`}
function closeM(){$('#layer').innerHTML=''}
function clearSess(){if(!confirm('Delete all logged sessions?'))return;S.sess=[];render()}
function clearLures(){if(!confirm('Remove all lures from your box?'))return;S.lures=[];S.ranked=null;render()}
function resetAll(){if(!confirm('Reset the app? This deletes your lures, rods, sessions and settings on this device.'))return;try{localStorage.removeItem('bw');localStorage.removeItem('bw_c')}catch(e){}location.reload()}
function resetTide(){S.toff={};if(RAW)buildAll(RAW.w,RAW.m);render()}
