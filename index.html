${lt(l)}${card('Alternatives','fish',alts.map(a=>`<div class="row" onclick="detail(${S.ranked.indexOf(a)})" style="cursor:pointer"><b style="font-size:13px">${ln(a.l)} <span class="n">${a.l.weight}g</span> ${a.l.colors[0].toLowerCase()}</b><b class="n" style="margin-left:auto;color:var(--g)">${a.m.toFixed(2)}</b></div>`).join(''))}
<button class="btn p" onclick="startSession(${i})">Start fishing with this →</button></div>`;scrollTo(0,0)}
function startSession(i){const r=S.ranked[i];S.sess.unshift({id:Date.now(),d:D.dstr+' '+f(D.t),loc:S.loc.name,lure:ln(r.l)+' '+r.l.weight+'g',pred:Math.round(D.B[D.ix]*100),res:null,pos:{fall:0,lift:0,pause:0,bottom:0},catches:0});closeM();go(5)}
const sess=(id,fn)=>{const s=S.sess.find(x=>x.id==id);if(s)fn(s);render()};
function log(){const ss=S.sess,P4=['fall','lift','pause','bottom'],tot=P4.map(k=>ss.reduce((s,x)=>s+x.pos[k],0)),st=tot.reduce((a,b)=>a+b,0),ct=ss.reduce((s,x)=>s+x.catches,0),rt=ss.filter(x=>x.res),sc=x=>x.res=='hit'?1:x.res=='partial'?.5:0,hp=rt.length?Math.round(100*rt.reduce((s,x)=>s+sc(x),0)/rt.length)+'%':'–';
const cal=[[0,40],[40,60],[60,80],[80,101]].map(([a,b])=>{const r=rt.filter(x=>x.pred>=a&&x.pred<b);return[a+'–'+Math.min(b,100),r.length?Math.round(r.reduce((s,x)=>s+x.pred,0)/r.length):0,r.length?Math.round(100*r.reduce((s,x)=>s+sc(x),0)/r.length):0,r.length]});
const cs=`<svg viewBox="0 0 340 120" width="100%">${[0,50,100].map(v=>`<line x1="30" x2="334" y1="${100-v*.9}" y2="${100-v*.9}" stroke="#1F2A3F" stroke-opacity=".5"/><text x="26" y="${103-v*.9}" font-size="9" fill="#5A6B85" text-anchor="end" class="mono">${v}%</text>`).join('')}${cal.map((b,i)=>`<rect x="${52+i*72}" y="${100-b[1]*.9}" width="22" height="${b[1]*.9}" fill="#3B82F6" opacity=".6"/><rect x="${76+i*72}" y="${100-b[2]*.9}" width="22" height="${b[2]*.9}" fill="#22C55E"/><text x="${76+i*72}" y="115" font-size="9" fill="#5A6B85" text-anchor="middle" class="mono">${b[0]} (${b[3]})</text>`).join('')}</svg><div class="sm">${rt.length?'Blue: predicted. Green: actual hit rate.':'Rate finished sessions to build this chart.'}</div>`;
const byL={};ss.forEach(x=>byL[x.lure]=(byL[x.lure]||0)+x.catches);const bl=Object.entries(byL).sort((a,b)=>b[1]-a[1])[0],pat=[];
if(bl&&bl[1]>0)pat.push(`${bl[0]} has produced the most catches (${bl[1]})`);if(st>0)pat.push(`Most strikes come on the ${P4[tot.indexOf(Math.max(...tot))]}`);
const bd={hit:['HIT','var(--g)'],partial:['PARTIAL','var(--w)'],miss:['MISS','var(--d)']};
return `<div class="grid">${[['Sessions',ss.length],['Strikes',st],['Catches',ct],['Window hit %',hp]].map(a=>`<div class="c"><div class="sm">${a[0]}</div><div class="n big">${a[1]}</div></div>`).join('')}</div>`
+card('Calibration','chart',cs,'T2')
+card('Strike positions','bolt',P4.map((k,i)=>bar(k[0].toUpperCase()+k.slice(1),st?Math.round(100*tot[i]/st):0,i==0?'var(--w)':'var(--g)')).join(''),'T3')
+card('Best patterns learned','target',pat.length?pat.map(t=>`<div class="row">${ic('target',16)}<span style="color:var(--t)">${t}</span></div>`).join(''):'<div class="sm">Log a few sessions to see patterns.</div>','T3')
+card('Recent sessions','book',ss.length?ss.slice(0,15).map(s=>`<div class="row" style="flex-direction:column;gap:6px"><div style="display:flex;width:100%;align-items:center"><div><b>${esc(s.loc)}</b><span class="n">${s.d} · ${s.lure} · predicted ${s.pred}%</span></div>${s.res?`<span class="tb" style="margin-left:auto;color:${bd[s.res][1]};border-color:${bd[s.res][1]}">${bd[s.res][0]}</span>`:''}<button class="x" style="background:none;border:0;color:var(--t3);margin-left:${s.res?'8px':'auto'}" onclick="S.sess=S.sess.filter(x=>x.id!=${s.id});render()">${ic('x',14)}</button></div><div class="chips">${P4.map(k=>`<button class="chip" onclick="sess(${s.id},s=>s.pos.${k}++)">+${k} ${s.pos[k]}</button>`).join('')}<button class="chip" onclick="sess(${s.id},s=>s.catches++)">+catch ${s.catches}</button></div><div class="chips">${['hit','partial','miss'].map(r=>`<button class="chip ${s.res==r?'on':''}" onclick="sess(${s.id},s=>s.res='${r}')">${bd[r][0]}</button>`).join('')}</div></div>`).join(''):'<div class="sm">No sessions yet. Open a lure in Results and tap Start fishing.</div>')}
S.rods=[Object.assign({id:1},RP['Shore MH'])];S.rid=1;
try{const j=JSON.parse(localStorage.getItem('bw')||'null');if(j){Object.assign(S,j);if(!j.rods&&j.rod)S.rods=[Object.assign({id:1,name:'Shore MH'},j.rod)]}}catch(e){}
S.rod=S.rods.find(r=>r.id==S.rid)||S.rods[0];S.rid=S.rod.id;
S.sess=S.sess||[];S.day=0;S.tsel=null;S.toff=S.toff||{};S.lang=S.lang||'en';
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&Date.now()-D.at>6e5)load(true)});
boot();
</script></body></html>
